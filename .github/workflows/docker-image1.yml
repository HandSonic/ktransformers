  #------------------------------------------------
  # 3. Merge and Push
  #    (Only runs after both build-amd64 & build-arm64 finish)
  #------------------------------------------------
  merge-manifest:
    runs-on: ubuntu-latest
    needs: [ build-amd64, build-arm64 ]

    steps:
      - name: Download amd64 image
        uses: actions/download-artifact@v4
        with:
          name: amd64-image
          path: /mnt/amd64.tar

      - name: Download arm64 image
        uses: actions/download-artifact@v4
        with:
          name: arm64-image
          path: /mnt/arm64.tar

      - name: Load images into Docker
        run: |
          docker load -i /mnt/amd64.tar
          docker load -i /mnt/arm64.tar
          # 现在本地 Docker Daemon 里有2个镜像: local-amd64, local-arm64

      - name: Check Docker version
        run: docker --version

      - name: Login Docker Hub
        uses: docker/login-action@v2
        with:
          registry: docker.io
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      # 方案A: 使用 Docker 23+ 新特性“一次性推送”
      #------------------------------------------------
      - name: Push single multi-arch image (Docker 23+)
        if: always()
        run: |
          # 1) 创建本地 manifest
          docker manifest create local-latest local-amd64 local-arm64
          docker manifest annotate local-latest local-amd64 --arch amd64
          docker manifest annotate local-latest local-arm64 --arch arm64
          
          # 2) 一次性推送到远端
          docker manifest push local-latest ${{ env.DOCKERHUB_REPO }}:latest

      # 方案B: 传统 docker manifest push
      # 如果你的 Docker 版本 < 23 或想显式生成 remote manifest
      #------------------------------------------------
      # - name: Create & push multi-arch manifest (traditional)
      #   run: |
      #     docker manifest create docker.io/username/repo:latest \
      #       local-amd64 \
      #       local-arm64
      #     docker manifest annotate docker.io/username/repo:latest local-amd64 --arch amd64
      #     docker manifest annotate docker.io/username/repo:latest local-arm64 --arch arm64
      #     docker manifest push docker.io/username/repo:latest