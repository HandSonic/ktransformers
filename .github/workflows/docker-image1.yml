      - name: Move Docker data directory
        run: |
          # 停止 Docker 服务
          sudo systemctl stop docker

          # 创建新的目录并将已有数据同步到新位置（为了安全，先同步现有数据）
          sudo mkdir -p /mnt/docker
          sudo rsync -avz /var/lib/docker/ /mnt/docker

          # 备份原目录并做软连接
          sudo rm -rf /var/lib/docker 
          sudo ln -s /mnt/docker /var/lib/docker

          # 重启 Docker
          sudo systemctl start docker

      - name: Check disk usage after
        run: df -h
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      - name: Check out code
        uses: actions/checkout@v3
      - name: Build local AMD64 image
        run: |
          docker buildx build \
            --platform linux/amd64 \
            --load \
            -t local-amd64 \
            .

      - name: Free up disk space complete
        run: |
          echo "Free up disk space complete"
          echo "=============================================================================="
          df -hT
          echo "=============================================================================="
      - name: Save as tar
        run: |
          mkdir -p build_artifacts
          docker save local-amd64 -o build_artifacts/amd64.tar
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: amd64-image
          path: build_artifacts/amd64.tar
          compression-level: 0
