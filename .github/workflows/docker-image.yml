
name: DockerHub CI

on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: '可选: 发布标签 (默认为当前日期)'
        required: true
        default: 'amd64'
env:
  DOCKERHUB_REPO: chatteohr/ktransformers
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      -
        name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      -
        name: Login to Docker Hub
        uses: docker/login-action@v2
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      -
        name: Set tags
        id: set_tags
        run: |
          if [ -z "${{ github.event.inputs.tag }}" ]; then
          echo "TAGS=${{ env.DOCKERHUB_REPO }}:latest" >> $GITHUB_ENV
          else
          echo "TAGS=${{ env.DOCKERHUB_REPO }}:latest ${{ env.DOCKERHUB_REPO }}:${{ github.event.inputs.tag }}" >> $GITHUB_ENV
          fi
      -
        name: Build and push
        uses: docker/build-push-action@v3
        with:
          push: true
          platforms: |
            linux/amd64
#            linux/arm64
#            linux/arm/v7
          tags: |
            ${{ env.TAGS }}

